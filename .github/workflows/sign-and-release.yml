name: Build, sign & release

# Manual trigger only: nothing runs automatically until you click
# "Run workflow" in the Actions tab. Builds the standalone .exe AND the
# macOS .app zips (Apple Silicon + Intel, cross-compiled) on a clean
# Windows machine, signs the exe if a code-signing certificate is configured
# as a repository secret, and uploads everything to the GitHub release.
#
# To sign, add these repository secrets (Settings → Secrets and variables →
# Actions), then run this workflow:
#   CODESIGN_PFX_BASE64    — your .pfx code-signing certificate, base64-encoded
#   CODESIGN_PFX_PASSWORD  — its password (leave empty if none)
# Without them the exe is built and released unsigned (SmartScreen warns).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag — bump it each release (e.g. v1.0.1, v1.0.2). Leave empty to auto-bump to the next patch after the latest release.'
        required: false
        default: ''

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Build the standalone exe
        run: node scripts/build-exe.mjs

      - name: Build the macOS apps (Apple Silicon + Intel)
        # Bun cross-compiles genuine Mach-O binaries from any host; the zip
        # writer stores the unix exec bit, so the .app is double-clickable.
        run: node scripts/build-mac.mjs all

      - name: Sign the exe
        if: ${{ env.HAS_CERT == 'true' }}
        env:
          HAS_CERT: ${{ secrets.CODESIGN_PFX_BASE64 != '' }}
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: node scripts/sign-exe.mjs --require

      - name: Create / update the GitHub release (exe + macOS zips)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-release.mjs ${{ github.event.inputs.tag }}
