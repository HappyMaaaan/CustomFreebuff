<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CustomFreebuff</title>
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #151517;
    --raised: #232327;
    --border: #2a2a2e;
    --text: #e7e7e8;
    --muted: #9a9aa0;
    --brand: #7cff3f;
    --danger: #d56a6a;
    --warn: #c8a93f;
    --ok: #5ecb7b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .logo {
    width: 26px; height: 26px;
    display: grid; place-items: center;
    border-radius: 7px;
    background: linear-gradient(135deg, var(--brand), #2f8f0a);
    color: #0c0d0f;
    font-size: 13px;
    font-weight: 800;
  }
  header h1 { margin: 0; font-size: 14px; font-weight: 700; }
  header p { margin: 0; font-size: 11px; color: var(--muted); }
  main { padding: 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
  .status { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #6a6a70; flex: none; }
  .dot.ok { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }
  .dot.err { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
  button {
    font: inherit;
    cursor: pointer;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 12px 16px;
    background: var(--raised);
    color: var(--text);
  }
  button:hover { background: #2a2a2e; }
  button:disabled { opacity: .55; cursor: default; }
  button.primary {
    background: var(--brand);
    border-color: var(--brand);
    color: #0c0d0f;
    font-weight: 800;
    font-size: 14px;
  }
  button.primary:hover { background: #92ff5c; border-color: #92ff5c; }
  .message {
    display: none;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-left: 3px solid var(--warn);
    border-radius: 8px;
    background: var(--surface);
    font-size: 12px;
  }
  .message.show { display: block; }
  .message.ok { border-left-color: var(--ok); }
  .message.error { border-left-color: var(--danger); }
  #btnCleanup { display: none; }
  #btnCleanup.show { display: block; }
  .foot { margin-top: auto; font-size: 10.5px; color: #6a6a70; text-align: center; }
</style>
</head>
<body>
<header>
  <div class="logo">CF</div>
  <div>
    <h1>CustomFreebuff</h1>
    <p>Injecteur de thème pour Freebuff Desktop</p>
  </div>
</header>

<main>
  <div class="status">
    <span class="dot" id="statusDot"></span>
    <span id="statusText">Connexion au lanceur…</span>
  </div>

  <button class="primary" id="btnPatch">🎯 Patch Freebuff (injection)</button>

  <div class="message" id="message"></div>

  <button id="btnCleanup">Nettoyer les processus restants</button>

  <p class="foot">Le choix des thèmes se fait directement dans Freebuff (bouton 🎨 en bas à droite).</p>
</main>

<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const dot = $('statusDot')
  const statusText = $('statusText')
  const message = $('message')
  const btnPatch = $('btnPatch')
  const btnCleanup = $('btnCleanup')

  // Fenêtre d'application (mode --app) : on la réduit au contenu.
  try { window.resizeTo(360, 300) } catch (e) { /* non bloquant */ }

  let msgTimer = null
  function showMessage(text, kind = '', ms = 5000) {
    message.textContent = text
    message.className = 'message show' + (kind ? ' ' + kind : '')
    clearTimeout(msgTimer)
    if (ms) msgTimer = setTimeout(() => (message.className = 'message'), ms)
  }

  async function api(path, method = 'GET', body = null) {
    const res = await fetch(path, {
      method,
      headers: body ? { 'content-type': 'application/json' } : undefined,
      body: body ? JSON.stringify(body) : undefined,
    })
    const json = await res.json().catch(() => ({}))
    return { status: res.status, ...json }
  }

  function setStatus(state) {
    if (!state.freebuffFound) {
      dot.className = 'dot err'
      statusText.textContent = 'Freebuff introuvable'
      return
    }
    if (state.running) {
      dot.className = 'dot warn'
      statusText.textContent = 'Freebuff est en cours d\u2019exécution — il doit être fermé pour le patch'
      return
    }
    if (state.debugAlive && state.connected > 0) {
      dot.className = 'dot ok'
      statusText.textContent = 'Freebuff est patché — Theme Engine actif'
      return
    }
    dot.className = 'dot'
    statusText.textContent = 'Freebuff est fermé — prêt pour le patch'
  }

  async function refresh() {
    const state = await api('/api/state').catch(() => null)
    if (!state) {
      dot.className = 'dot err'
      statusText.textContent = 'Lanceur injoignable'
      return
    }
    setStatus(state)
    btnCleanup.className = (!state.running && state.staleCount > 0) ? 'show' : ''
  }

  btnPatch.addEventListener('click', async () => {
    btnPatch.disabled = true
    statusText.textContent = 'Patch en cours… (le lancement peut prendre jusqu\u2019à 45 s)'
    try {
      const r = await api('/api/launch', 'POST')
      if (r.ok && r.started) {
        showMessage('Freebuff est lancé avec l\u2019injection. Le bouton 🎨 Thèmes est en bas à droite de Freebuff.', 'ok', 7000)
        dot.className = 'dot ok'
        statusText.textContent = 'Freebuff est patché — Theme Engine actif'
      } else if (r.error === 'already-running' || r.status === 409) {
        showMessage('Freebuff est déjà en cours d\u2019exécution : fermez-le (fenêtre ou processus), puis cliquez à nouveau sur Patch.', 'error', 8000)
        dot.className = 'dot warn'
        statusText.textContent = 'Freebuff est en cours d\u2019exécution — il doit être fermé pour le patch'
      } else if (r.error === 'freebuff-not-found') {
        showMessage(r.message || 'Freebuff est introuvable.', 'error', 10000)
      } else {
        showMessage(r.message || 'Le patch a échoué.', 'error', 10000)
      }
    } catch (err) {
      showMessage('Impossible de joindre le lanceur : ' + err.message, 'error', 8000)
    } finally {
      btnPatch.disabled = false
      refresh()
    }
  })

  btnCleanup.addEventListener('click', async () => {
    const r = await api('/api/cleanup', 'POST')
    showMessage(r.message || 'Nettoyage terminé.', 'ok', 5000)
    refresh()
  })

  refresh()
  setInterval(refresh, 2000)
})()
</script>
</body>
</html>
