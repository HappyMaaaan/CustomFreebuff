<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Freebuff Desktop (fixture)</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e0e;
    --surface: #151517;
    --surface-2: #1b1b1e;
    --raised: #232327;
    --border: #2a2a2e;
    --chrome: #0a0a0b;
    --text: #e7e7e8;
    --muted: #9a9aa0;
    --brand: #7cff3f;
    --brand-dim: #5bbf2f;
    --accent: #d9d9de;
    --danger: #d56a6a;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f3f4;
    --surface: #fbfbfc;
    --text: #1d1d20;
    --muted: #63636b;
    --brand: #368f06;
  }
  body { background: var(--bg); color: var(--text); font-family: sans-serif; }
  /* Demo elements that consume the tokens — the VS1 DoD proof: one token
     (accent) drives several coherent places (link, vars). */
  #demo-panel { background: var(--surface); border: 1px solid var(--border); padding: 16px; border-radius: 8px; }
  #demo-link { color: var(--brand); }
  /* VS2 — one element per component, styled with the app's own tokens, so
     component overrides are visible and isolated from each other. */
  button { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 8px 14px; font-weight: 700; cursor: pointer; }
  input, textarea, select { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }
  .card { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  aside.sidebar { background: var(--chrome); color: var(--text); padding: 10px; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
</style>
</head>
<body>
  <h1>fixture</h1>
  <div id="demo-panel">
    <button id="demo-btn">Demo button</button>
    <input id="demo-input" placeholder="Type here" />
    <a id="demo-link" href="#">Demo link</a>
    <div class="card">Card</div>
    <aside class="sidebar">Sidebar</aside>
    <div class="modal" role="dialog">Modal</div>
  </div>
  <script>
    // Imite l'API exposée par le preload de Freebuff.
    window.__nativeThemeCalls = []
    window.freebuffDesktop = {
      setTheme: function (t) { window.__nativeThemeCalls.push(t) },
    }
  </script>
</body>
</html>
